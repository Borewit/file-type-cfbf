# Release notes use the package.json version passed by the workflow.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - type: pre-exclude
    when:
      labels:
        - DevOps
        - dev-dependencies
  - title: 💥 API Changes
    when:
      label: API change
  - title: 🚀 Enhancements
    when:
      label: enhancement
  - title: 🎨 Improvements
    when:
      label: improvement
  - title: 🐛 Bug Fixes
    when:
      label: bug
  - title: 🔧 Under the hood
    when:
      label: technical debt
  - title: ⬆️ Dependencies
    when:
      label: dependencies
  - title: 📝 Documentation
    when:
      label: documentation
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\\<*_&'
template: |
  ## Changes

  $CHANGES

  ## NPM release
  NPM release: [file-type-cfbf-plus@$RESOLVED_VERSION](https://www.npmjs.com/package/file-type-cfbf-plus/v/$RESOLVED_VERSION)
